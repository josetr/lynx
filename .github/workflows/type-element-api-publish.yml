name: type_element_api_publish

on: workflow_dispatch

jobs:
  check-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynx
          fetch-depth: 2 # latest 2 commits

      - name: Check version field change
        id: check
        run: |
          # achieve content of package.json 
          cd $GITHUB_WORKSPACE/lynx
          version_current=$(jq -r '.version' js_libraries/type-element-api/package.json)
          version_before=$(git show HEAD~1:js_libraries/type-element-api/package.json | jq -r '.version')

          echo "Current version: $version_current"
          echo "Previous version: $version_before"

          if [ "$version_current" != "$version_before" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  type_element_api_publish:
    if: needs.check-version-change.outputs.version_changed == 'true'
    needs: check-version-change
    runs-on: macOS-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynx
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Common Dependencies
        uses: ./lynx/.github/actions/common-deps
        with:
          cache-backend: github
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 7.33.6
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REPO_TYPE_ELEMENT_API_NPM_TOKEN }}
        run: |-
          cd $GITHUB_WORKSPACE/lynx
          source tools/envsetup.sh
          pushd js_libraries/type-element-api
          npm publish --access public
          popd
